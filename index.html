<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Catch: Abyss Hunter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">
    <div id="hud">
      <div>Coin: <span id="coins">0</span></div>
      <div>Cargo: <span id="cargo">0</span>/5</div>
      <div>Oxygen: <span id="oxygen">100</span>%</div>
      <div>Hull: <span id="hull">100</span>%</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
      <div class="move-pad">
        <button id="up">▲</button>

        <div>
          <button id="left">◀</button>
          <button id="down">▼</button>
          <button id="right">▶</button>
        </div>
      </div>

      <button id="fire">🎯 FIRE</button>
      <button id="sell">🏝️ SELL</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
